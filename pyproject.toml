[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "optimatch"
version = "0.1.0"
description = "Optical prescription matching and study-model export tools"
readme = "README.md"
requires-python = ">=3.13"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
release = ["build>=1.2", "twine>=6"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
optimatch = ["examples/*.csv"]

[tool.setuptools.packages.find]
where = ["."]
include = ["optimatch*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
